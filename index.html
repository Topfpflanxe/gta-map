<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>GTA Minimap</title>
<script>window.onerror=function(m,u,l){var e=document.getElementById('smsg');if(e)e.textContent='Fehler im Code: '+m+' (Zeile '+l+')';};</script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>window.maplibregl||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"><\/script>');</script>
<style>
  html,body{margin:0;height:100%;background:#0b0c0d;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .maplibregl-map{position:relative;overflow:hidden}
  .maplibregl-canvas{position:absolute;left:0;top:0}
  .maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}
  .maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-top-left,.maplibregl-ctrl-top-right{display:none}

  #wrap{position:relative;width:min(88vw,58vh);height:min(88vw,58vh)}
  #ring{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:4px solid #000;
        box-shadow:0 0 0 2px #3a3d40,0 0 40px #000;background:#16181a;cursor:pointer}
  #map{position:absolute;inset:0;pointer-events:none}
  #vignette,#noise{position:absolute;inset:0;border-radius:50%;pointer-events:none}
  #vignette{background:radial-gradient(circle,transparent 55%,rgba(0,0,0,.65) 100%)}
  #noise{opacity:.12;mix-blend-mode:overlay;background-image:repeating-linear-gradient(0deg,#fff 0 1px,#000 1px 3px)}
  .arrow{width:26px;height:26px;filter:drop-shadow(0 0 3px #000)}
  .badge{width:28px;height:28px;border-radius:50%;background:#000;border:2px solid #fff;font-size:15px;
         display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
  #compass{position:absolute;inset:-6px;pointer-events:none}
  #compass .badge{position:absolute;left:50%;top:0;margin:-6px 0 0 -16px}
  #bars{width:min(88vw,58vh);margin-top:22px;display:flex;height:10px;background:#000;border:2px solid #000}
  #hp{flex:1;background:#4a9a4f}#ar{flex:1;background:#2c6b8f}
  #info{margin-top:10px;font-size:13px;opacity:.7;letter-spacing:.5px}

  /* Großansicht */
  body.big #ring{position:fixed;inset:0;border-radius:0;border:none;box-shadow:none;z-index:5;cursor:auto}
  body.big #map{pointer-events:auto;touch-action:none}
  body.big #vignette,body.big #noise,body.big #compass,body.big #bars{display:none}
  body.big #info{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);
                 z-index:7;background:#000b;padding:6px 14px;border-radius:20px;opacity:1;margin:0}
  .btn{width:44px;height:44px;border-radius:50%;background:#000c;border:2px solid #fff;color:#fff;font-size:20px;
       display:flex;align-items:center;justify-content:center;padding:0}
  #tools{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:12px;z-index:8;display:flex;flex-direction:column;gap:10px}
  #north,#recenter{display:none}
  body.big #north{display:flex}
  body.big.free #recenter{display:flex}
  #close{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;z-index:8;display:none}
  body.big.canclose #close{display:flex}

  #panel,#rpanel{position:fixed;inset:0;z-index:20;background:#000c;display:none;align-items:center;justify-content:center}
  #panel.open,#rpanel.open{display:flex}
  #card,#rcard{background:#17191b;border:2px solid #3a3d40;border-radius:18px;padding:20px;width:min(86vw,340px)}
  #card h3,#rcard h3{margin:0 0 14px;font-size:17px}
  .row{margin-bottom:14px}.row label{display:block;font-size:13px;opacity:.7;margin-bottom:6px}
  .seg{display:flex;border:2px solid #3a3d40;border-radius:12px;overflow:hidden}
  .seg button{flex:1;padding:10px 0;background:none;border:none;color:#fff;font-size:15px}
  .seg button.on{background:#c9a227;color:#000;font-weight:600}
  #done{width:100%;padding:12px;border-radius:12px;border:none;background:#fff;color:#000;font-size:16px;margin-top:4px}
  #rcard input{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:2px solid #3a3d40;background:#0e0f10;color:#fff;font-size:16px;margin-bottom:10px}
  #rcard button{width:100%;padding:12px;border-radius:12px;border:none;font-size:16px;margin-top:6px}
  #rgo{background:#9d5cf2;color:#fff;font-weight:600}
  #rclear{background:#2a2d30;color:#fff}#rcancel{background:none;color:#aaa}
  #rmsg{font-size:13px;min-height:18px;opacity:.85;margin:2px 0 4px}
  #dist{position:absolute;left:24%;bottom:15%;display:none;pointer-events:none;text-shadow:0 0 4px #000,0 0 2px #000;line-height:1}
  #dist b{font-size:20px;font-weight:700;letter-spacing:-.5px}#dist small{display:block;font-size:12px;opacity:.85;margin-top:3px}
  body.big #dist{left:16px;bottom:calc(env(safe-area-inset-bottom) + 70px)}
  body.big #dist b{font-size:26px}
  #start{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;z-index:30}
  #start button{font-size:18px;padding:14px 32px;border-radius:30px;border:2px solid #fff;background:#000;color:#fff}
  #start p{max-width:300px;opacity:.75;font-size:14px;margin:0}
</style>
</head>
<body>
<div id="wrap">
  <div id="ring"><div id="map"></div><div id="vignette"></div><div id="noise"></div><div id="dist"><b id="dv"></b><small id="dt"></small></div></div>
  <div id="compass"><div class="badge">N</div></div>
</div>
<div id="bars"><div id="hp"></div><div id="ar"></div></div>
<div id="info">Warte auf GPS …</div>

<button class="btn" id="close" aria-label="Schließen">✕</button>
<div id="tools">
  <button class="btn" id="routebtn" aria-label="Route">➤</button>
  <button class="btn" id="gear" aria-label="Einstellungen">⚙</button>
  <button class="btn" id="north" aria-label="Norden"><span class="badge" style="border:none;background:none">N</span></button>
  <button class="btn" id="recenter" aria-label="Zentrieren">◎</button>
</div>

<div id="panel"><div id="card">
  <h3>Einstellungen</h3>
  <div class="row"><label>Anzeige</label><div class="seg" data-k="layout">
    <button data-v="circle">Kreis</button><button data-v="full">Vollbild</button></div></div>
  <div class="row"><label>Kreisansicht: Was dreht sich?</label><div class="seg" data-k="crot">
    <button data-v="0">Pfeil</button><button data-v="1">Karte</button></div></div>
  <div class="row"><label>Karte dreht sich mit (Großansicht)</label><div class="seg" data-k="rotate">
    <button data-v="1">An</button><button data-v="0">Nordoben</button></div></div>
  <div class="row"><label>3D-Neigung (Großansicht)</label><div class="seg" data-k="tilt">
    <button data-v="1">An</button><button data-v="0">Aus</button></div></div>
  <button id="done">Fertig</button>
</div></div>

<div id="rpanel"><div id="rcard">
  <h3>Route</h3>
  <input id="rfrom" placeholder="Von (leer = Mein Standort)" autocomplete="off">
  <input id="rto" placeholder="Nach (Adresse oder Ort)" autocomplete="off">
  <div id="rmsg"></div>
  <button id="rgo">Schnellste Route</button>
  <button id="rclear">Route löschen</button>
  <button id="rcancel">Schließen</button>
</div></div>

<div id="start">
  <p id="smsg">Lade …</p>
  <button id="go">Start</button>
  <small style="opacity:.4;font-size:11px">Version 19.10.-C</small>
</div>

<script>
const $ = id => document.getElementById(id);
const C = {ground:'#1b1b1c',water:'#3a4b56',glow:'#c4d6e0',building:'#4a4a4c',minor:'#7a7a7c',mid:'#a6a6a8',major:'#cdcdcf'};
const W = ['interpolate',['exponential',1.5],['zoom']];
const style = {version:8, light:{anchor:'viewport',color:'#ffffff',intensity:0.4,position:[1.15,210,35]}, sources:{omt:{type:'vector',url:'https://tiles.openfreemap.org/planet'}}, layers:[
  {id:'bg',type:'background',paint:{'background-color':C.ground}},
  {id:'water',type:'fill',source:'omt','source-layer':'water',paint:{'fill-color':C.water}},
  {id:'water-glow',type:'line',source:'omt','source-layer':'water',
    paint:{'line-color':C.glow,'line-opacity':0.55,'line-blur':6,'line-width':[...W,10,2,19,14]}},
  {id:'rm',type:'line',source:'omt','source-layer':'transportation',filter:['in','class','minor','service'],
    paint:{'line-color':C.minor,'line-width':[...W,14,1,19,9]}},
  {id:'rmid',type:'line',source:'omt','source-layer':'transportation',filter:['in','class','tertiary','secondary'],
    paint:{'line-color':C.mid,'line-width':[...W,12,1.2,19,15]}},
  {id:'rmaj',type:'line',source:'omt','source-layer':'transportation',filter:['in','class','primary','trunk','motorway'],
    paint:{'line-color':C.major,'line-width':[...W,10,1.8,19,24]}},
  {id:'bld3d',type:'fill-extrusion',source:'omt','source-layer':'building',minzoom:13,
    paint:{'fill-extrusion-color':C.building,'fill-extrusion-opacity':1,
      'fill-extrusion-height':['max',['to-number',['get','render_height'],6],5],
      'fill-extrusion-base':['to-number',['get','render_min_height'],0]}},
  {id:'poi-fuel',type:'symbol',source:'omt','source-layer':'poi',minzoom:13,
    filter:['==',['get','class'],'fuel'],
    layout:{'icon-image':'fuel','icon-allow-overlap':true,'icon-pitch-alignment':'viewport',
      'icon-size':['interpolate',['linear'],['zoom'],13,0.4,18,0.85]}}
]};

/* Einstellungen */
let S = {layout:'circle', rotate:'1', tilt:'1', crot:'0'};
try{ Object.assign(S, JSON.parse(localStorage.getItem('gtamini')||'{}')); }catch(e){}
const save = () => { try{ localStorage.setItem('gtamini', JSON.stringify(S)); }catch(e){} };

let map, marker, started=false, expanded=false, following=true;
let hd=0, zoomNow=17.2, lastLL=null, mPos=null, anim=null, gpsHeading=null, compassHeading=null;
const isBig = () => S.layout==='full' || expanded;
const rotMap = () => isBig() ? S.rotate==='1' : S.crot==='1';


function fuelIcon(){
  const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  x.fillStyle='#c4c4c6'; x.beginPath(); x.arc(32,32,29,0,7); x.fill();
  x.lineWidth=3; x.strokeStyle='#000'; x.stroke();
  x.fillStyle='#000';
  x.fillRect(19,15,18,32);          // Säule
  x.fillRect(16,46,24,5);           // Fuß
  x.fillStyle='#c4c4c6'; x.fillRect(23,19,10,9);  // Display
  x.fillStyle='#000';
  x.fillRect(37,24,6,3); x.fillRect(41,24,3,16);  // Schlauch
  x.beginPath(); x.moveTo(44,40); x.lineTo(49,40); x.lineTo(46.5,45); x.fill(); // Zapfhahn
  return x.getImageData(0,0,64,64);
}

function initMap(lng,lat){
  lastLL=[lng,lat];
  map = new maplibregl.Map({container:'map',style,center:lastLL,zoom:zoomNow,pitch:55,bearing:hd,
    attributionControl:false,fadeDuration:0,maxPitch:70});
  map.on('styleimagemissing',e=>{ if(e.id==='fuel' && !map.hasImage('fuel')) map.addImage('fuel',fuelIcon(),{pixelRatio:2}); });
  const el = document.createElement('div');
  el.innerHTML='<svg class="arrow" viewBox="0 0 26 26"><path d="M13 2 L23 23 L13 18 L3 23 Z" fill="#ececee" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  marker = new maplibregl.Marker({element:el,rotationAlignment:'map',pitchAlignment:'viewport'}).setLngLat(lastLL).addTo(map);
  mPos=lastLL;
  map.on('rotate',()=>{ const t=`rotate(${-map.getBearing()}deg)`; $('compass').style.transform=t; $('north').style.transform=t; });
  const release = e => { if(isBig() && e.originalEvent){ following=false; refresh(); } };
  ['dragstart','rotatestart','pitchstart'].forEach(ev=>map.on(ev,release));
  apply(true);
}

function setInteractive(on){
  ['dragPan','scrollZoom','touchZoomRotate','touchPitch','doubleClickZoom','dragRotate'].forEach(h=>{
    try{ map[h][on?'enable':'disable'](); }catch(e){}
  });
}

function refresh(){
  document.body.classList.toggle('free', isBig() && !following);
}

function apply(reset){
  const big=isBig();
  document.body.classList.toggle('big',big);
  document.body.classList.toggle('canclose',big && S.layout==='circle');
  document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',S[s.dataset.k]===b.dataset.v)));
  if(!map) return;
  setInteractive(big);
  map.resize();
  const h=$('ring').clientHeight, size=$('ring').clientWidth;
  map.setPadding({top:Math.round(big?h*0.3:size*0.34),bottom:0,left:0,right:0});
  if(reset){ following=true; }
  refresh();
  const o={center:lastLL,duration:500,
    pitch:(!big||S.tilt==='1')?55:0,
    zoom:big?Math.min(zoomNow,16.6):zoomNow,
    bearing:rotMap()?hd:0};
  map.easeTo(o);
}

function follow(dur){
  if(!map||!following) return;
  const big=isBig(), o={center:lastLL,duration:dur,easing:t=>t};
  if(!big){ o.bearing=S.crot==='1'?hd:0; o.zoom=zoomNow; o.pitch=55; }
  else if(S.rotate==='1') o.bearing=hd;
  map.easeTo(o);
}

function tween(ll){
  const from=mPos, t0=performance.now(); cancelAnimationFrame(anim);
  const step=now=>{ const k=Math.min((now-t0)/900,1);
    mPos=[from[0]+(ll[0]-from[0])*k, from[1]+(ll[1]-from[1])*k]; marker.setLngLat(mPos);
    if(k<1) anim=requestAnimationFrame(step); };
  anim=requestAnimationFrame(step);
}

function turnTo(h,f){ hd += (((h-hd+540)%360)-180)*f; }

function update(pos){
  const {latitude:lat,longitude:lng,speed,heading,accuracy}=pos.coords;
  const kmh=speed?speed*3.6:0;
  gpsHeading=(speed>1.2 && heading!=null && !isNaN(heading))?heading:null;
  const h=gpsHeading ?? compassHeading;
  if(h!=null) turnTo(h,0.5);
  zoomNow += ((17.6-Math.min(kmh/90,1)*1.6)-zoomNow)*0.4;
  infoBase=`${Math.round(kmh)} km/h · ±${Math.round(accuracy)} m`;
  if(!map){ initMap(lng,lat); marker.setRotation(hd); return; }
  lastLL=[lng,lat]; tween(lastLL); marker.setRotation(hd); follow(900); updateRemaining();
}

let absAt=0, lastOri=0, infoBase='Warte auf GPS …';
function eulerHeading(alpha,beta,gamma){   // kippkompensiert: Richtung, in die die Rückseite des Handys zeigt
  const d=Math.PI/180,a=alpha*d,b=beta*d,g=gamma*d;
  const cA=Math.cos(a),sA=Math.sin(a),cB=Math.cos(b),sB=Math.sin(b),cG=Math.cos(g),sG=Math.sin(g);
  const rA=-cA*sG-sA*sB*cG, rB=-sA*sG+cA*sB*cG;
  return ((Math.atan2(rA,rB)/d)+360)%360;
}
function onOrientation(e){
  let h=null;
  if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;
  else if(e.alpha!=null && e.beta!=null && e.gamma!=null){
    if(e.type==='deviceorientationabsolute' || e.absolute){ absAt=Date.now(); h=eulerHeading(e.alpha,e.beta,e.gamma); }
    else if(Date.now()-absAt>2000) h=eulerHeading(e.alpha,e.beta,e.gamma);
  }
  if(h==null) return;
  lastOri=Date.now();
  compassHeading=h;
  if(gpsHeading==null && map){
    turnTo(h,0.15); marker.setRotation(hd);
    if(following && rotMap()) map.setBearing(hd);
  }
}

/* Route */
const PURPLE='#9d5cf2';
let route=null, destMarker=null;
const $m=t=>{ $('rmsg').textContent=t; };
const meters=(a,b)=>{ const k=Math.cos(a[1]*Math.PI/180); return Math.hypot((b[0]-a[0])*k*111320,(b[1]-a[1])*110540); };
const fmt=m=>m>=1000?(m/1000).toFixed(2)+'km':Math.round(m/10)*10+'m';
async function geocode(q){
  let u='https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=de&q='+encodeURIComponent(q);
  if(lastLL){ const [x,y]=lastLL; u+=`&viewbox=${x-1},${y+1},${x+1},${y-1}`; }
  const j=await (await fetch(u)).json();
  if(!j.length) throw new Error('Nicht gefunden: '+q);
  return [+j[0].lon,+j[0].lat];
}
function drawRoute(data){
  const go=()=>{
    if(map.getSource('route')){ map.getSource('route').setData(data); return; }
    map.addSource('route',{type:'geojson',data});
    const lay={'line-cap':'round','line-join':'round'};
    map.addLayer({id:'route-glow',type:'line',source:'route',layout:lay,
      paint:{'line-color':PURPLE,'line-opacity':0.35,'line-blur':4,'line-width':[...W,12,6,19,28]}},'bld3d');
    map.addLayer({id:'route-line',type:'line',source:'route',layout:lay,
      paint:{'line-color':PURPLE,'line-width':[...W,12,3,19,15]}},'bld3d');
  };
  if(map.isStyleLoaded()) go(); else map.once('load',go);
}
function updateRemaining(){
  if(!route||!lastLL) return;
  let bi=0,bd=1e18; const k=Math.cos(lastLL[1]*Math.PI/180);
  route.coords.forEach((c,i)=>{ const d=((c[0]-lastLL[0])*k)**2+(c[1]-lastLL[1])**2; if(d<bd){bd=d;bi=i;} });
  const rem=Math.max(0,route.total-route.cum[bi]);
  $('dv').textContent='↑ '+fmt(rem);
  $('dt').textContent=Math.max(1,Math.round(route.dur*rem/route.total/60))+' min';
}
async function calcRoute(){
  const from=$('rfrom').value.trim(), to=$('rto').value.trim();
  if(!to){ $m('Bitte ein Ziel eingeben.'); return; }
  $('rgo').disabled=true; $m('Suche …');
  try{
    const b=from?await geocode(from):lastLL;
    if(!b) throw new Error('Noch kein GPS – gib einen Startpunkt ein.');
    const e=await geocode(to);
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${b[0]},${b[1]};${e[0]},${e[1]}?overview=full&geometries=geojson`);
    const j=await r.json();
    if(j.code!=='Ok') throw new Error('Keine Route gefunden.');
    const rt=j.routes[0], coords=rt.geometry.coordinates, cum=[0];
    for(let i=1;i<coords.length;i++) cum.push(cum[i-1]+meters(coords[i-1],coords[i]));
    route={coords,cum,total:Math.max(cum[cum.length-1],1),dur:rt.duration,km:rt.distance};
    if(!map){ initMap(b[0],b[1]); marker.setRotation(hd); }
    drawRoute({type:'Feature',geometry:rt.geometry});
    if(destMarker) destMarker.remove();
    const d=document.createElement('div');
    d.style.cssText='width:16px;height:16px;border-radius:50%;background:'+PURPLE+';border:3px solid #fff;box-shadow:0 0 6px #000';
    destMarker=new maplibregl.Marker({element:d}).setLngLat(e).addTo(map);
    $('dist').style.display='block'; updateRemaining();
    $m(`${(rt.distance/1000).toFixed(1)} km · ${Math.round(rt.duration/60)} min`);
    $('rpanel').classList.remove('open');
    if(S.layout==='circle') expanded=true;
    apply(true);
    const bb=new maplibregl.LngLatBounds(); coords.forEach(c=>bb.extend(c));
    map.setPadding({top:0,bottom:0,left:0,right:0});
    following=false; refresh();
    map.fitBounds(bb,{padding:{top:90,bottom:110,left:50,right:50},pitch:0,bearing:0,duration:800});
  }catch(err){ $m(err.message||'Fehler bei der Routenberechnung.'); }
  $('rgo').disabled=false;
}
function clearRoute(){
  route=null; $('dist').style.display='none'; $m('');
  if(map&&map.getSource('route')) map.getSource('route').setData({type:'FeatureCollection',features:[]});
  if(destMarker){ destMarker.remove(); destMarker=null; }
}
$('routebtn').addEventListener('click',()=>$('rpanel').classList.add('open'));
$('rcancel').addEventListener('click',()=>$('rpanel').classList.remove('open'));
$('rgo').addEventListener('click',calcRoute);
$('rclear').addEventListener('click',clearRoute);

/* Bedienung */
$('ring').addEventListener('click',()=>{ if(!isBig() && map){ expanded=true; apply(true); } });
$('close').addEventListener('click',()=>{ expanded=false; apply(true); });
$('recenter').addEventListener('click',()=>{ following=true; apply(false); });
$('north').addEventListener('click',()=>{ if(!map) return; if(S.rotate==='1'){ following=false; refresh(); } map.easeTo({bearing:0,duration:400}); });
$('gear').addEventListener('click',()=>$('panel').classList.add('open'));
$('done').addEventListener('click',()=>$('panel').classList.remove('open'));
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  S[b.parentNode.dataset.k]=b.dataset.v; save();
  if(S.layout==='full') expanded=false;
  apply(true);
}));
apply(true);

async function start(){
  if(started) return;
  if(typeof maplibregl==='undefined'){ $('smsg').textContent='Kartenbibliothek nicht geladen – Seite neu laden.'; return; }
  started=true; $('start').style.display='none';
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermi
