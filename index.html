<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test</title>
<style>
  body{font-family:system-ui,sans-serif;background:#111;color:#eee;padding:20px;line-height:1.6;font-size:16px}
  h2{margin-top:0}
  .ok{color:#6fd36f}.bad{color:#ff7b7b}
  button{font-size:18px;padding:12px 24px;border-radius:24px;border:2px solid #fff;background:#000;color:#fff;margin:12px 0}
</style>
</head>
<body>
<h2>Handy-Test</h2>
<div id="out">JavaScript: <span class="bad">läuft NICHT</span></div>
<button id="b">Tippe mich</button>
<div id="tap"></div>

<script>
var out = document.getElementById('out');
function line(t, ok){ out.innerHTML += '<br>' + t + ' <span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'ja' : 'nein') + '</span>'; }
out.innerHTML = 'JavaScript: <span class="ok">läuft ✓</span>';
document.getElementById('b').addEventListener('click', function(){
  document.getElementById('tap').textContent = 'Button funktioniert ✓';
});
line('Standort-API vorhanden', !!navigator.geolocation);
line('Kompass-API vorhanden', typeof DeviceOrientationEvent !== 'undefined');
line('Sicherer Kontext (https)', window.isSecureContext);
try{ localStorage.setItem('t','1'); line('Speicher erlaubt', true); }catch(e){ line('Speicher erlaubt', false); }
out.innerHTML += '<br>Browser: ' + navigator.userAgent;

function loadScript(url, name){
  var s = document.createElement('script');
  s.src = url;
  s.onload = function(){ line(name + ' geladen, maplibregl vorhanden', typeof maplibregl !== 'undefined'); };
  s.onerror = function(){ line(name + ' geladen', false); };
  document.head.appendChild(s);
}
loadScript('https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js', 'jsdelivr');

fetch('https://tiles.openfreemap.org/planet').then(function(r){ line('Kartendaten erreichbar', r.ok); })
  .catch(function(){ line('Kartendaten erreichbar', false); });
</script>
</body>
</html>
